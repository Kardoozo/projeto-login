<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eu fiz midia query</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="midia.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=key,person,email" />
</head>
<body>
    <main>
        <section id="login">
            <div id="imagem">

            </div>
            

            <div id="formulario">
                <h1>Login</h1>
            <p>Seja Bem-vindo(a). Faça login para acessar sua conta.</p>

            <form action="nada.php" method="post" autocomplete="on">
                <div class="campo">
                    <span class="material-symbols-rounded">person</span>
                    <input type="email" name="login" id="ilogin" placeholder="Digite seu e-mail" required autocomplete="email" maxlength="30">
                    <label for="ilogin">login</label>
                </div>

                <div class=" campo">
                    <span class="material-symbols-rounded">key</span>
                    <input type="password" name="senha" id="isenha" placeholder="Digite sua senha" readonly autocomplete="current-password" minlength="8" maxlength="20">
                    <label for="isenha">senha</label>
                </div>
                <input type="submit" value="Entrar">
                <a href="#" class="botao">Esqueci a senha <span class="material-symbols-rounded">email</span></a>
            </form >
            </div>
        </section>
    </main>
</body>
</html>
